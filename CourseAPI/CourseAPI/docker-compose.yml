services:
  mysql:
    image: mysql:8.4
    container_name: kursplassen-mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: kursplassen
      MYSQL_USER: kursUser
      MYSQL_PASSWORD: kursPwd
    ports:
      - "127.0.0.1:3320:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: